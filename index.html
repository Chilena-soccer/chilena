<title>Chilena – Soccer Training</title>
<meta name="description" content="Chilena: weekly soccer training programs, drills with animated diagrams, streaks and progress tests.">
<style>
  :root { --bg: #ffffff; --text: #1d2330; --muted: #5b6577; --accent: #1f9d4a; --card: #f2f2f7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #f2f2f7; --muted: #8e8e93; --accent: #30d158; --card: #1c1c1e; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px 64px; text-align: center; }
  h1 { font-size: 40px; margin: 12px 0 4px; letter-spacing: -0.8px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .ball { width: 72px; height: 72px; }
  nav { display: grid; gap: 10px; max-width: 320px; margin: 0 auto; }
  nav a { display: block; background: var(--card); color: var(--text); text-decoration: none; font-weight: 600; padding: 14px 16px; border-radius: 14px; }
  nav a:hover { color: var(--accent); }
  footer { margin-top: 36px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--accent); }
</style>
